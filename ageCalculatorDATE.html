</head>
<body>
    <h1 style="text-align: center;">Age Calculator</h1>
    <p style="color: rgb(212, 14, 80);"><b><u>Please fill below info to calculate your age</u></b></p>
    <div>
        <label for="">Enter your Birth date</label>
        <input type="date" id="dob"><br><br>
           <button onclick="calculateAge()" class="btn btn-danger">Calculate Age</button>
    </div>
        
    <p id="result"></p>
    </div>
    <script>
        function calculateAge(){
            let dob=document.getElementById("dob").value;
            if(dob===""){
                document.getElementById("result").innerText="please Enter date of birth";
             return;
            }
               let birthDate = new Date(dob);
            let today = new Date();

            let age = today.getFullYear() - birthDate.getFullYear();
            let month = today.getMonth() - birthDate.getMonth();
            let day = today.getDate() - birthDate.getDate();

            // Adjust if birthday hasn’t come yet this year
            if (month < 0 || (month === 0 && day < 0)) {
                age--;
            }

            document.getElementById("result").innerText = `🎉 Your Age is: ${age} years`;
        }
        
    </script>
    
</body>
</html>
