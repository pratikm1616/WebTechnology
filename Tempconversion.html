<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
    <h1>Temperature Conversion</h1>
    <label for="">Enter Number to check : </label>
    <input type="number" id="temp" placeholder="Number">
<br>
    <button type="button" id="toFaranite" onclick="faranite()">To Faranite</button>
    <button type="button" id="toCelsicus" onclick="toCelsicus()">To Celsicis</button>

    <p id="result"></p>
</div>
    <script>
        function faranite(){
        let val=document.getElementById("temp").value;
            if(val>0){
               let resultdata=document.getElementById("result");
              let faranite= (val*9/5)+32;
                 resultdata.innerHTML=`Celsius To Faranite:${faranite}`;
            
            }
            else{
                window.alert("Enter Valid Celsius");
            }
        }

        function toCelsicus(){
            let val=document.getElementById("temp").value;
            if(val<=0){
                window.alert("Enter valid Faranite");
            }
            else{
                let resultdata=document.getElementById("result");
                let celsius=(val-32)*5/9;
                resultdata.innerHTML=`Faranite To Celsius ${celsius}`;
            }
        }
    </script>
</body>
</html>
