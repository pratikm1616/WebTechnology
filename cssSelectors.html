<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* element selector*/
        h3{
            color: red;
            background-color: aqua;
        }
        /*group selector*/
        em,strong{
            color: brown;
            background-color: beige;
        }
        /*id selector*/
        #p1{
            color: cadetblue;
            background-color:brown ;
        }
        /* class selector*/
        .cls1{
            color: blueviolet;
            text-decoration: underline;
            align-items: center;
        }
        /* universal selector*/
        *{
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
    <h3>Pune</h3>
    <h4>Baramati</h4>
    <em>Pratik Mohite</em>
    <strong>Engineer</strong>

    <p id="p1">hello world</p>

    <p class="cls1"> fuck you </p>
</body>
</html>
