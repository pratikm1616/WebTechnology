<!DOCTYPE html>
<html>
    <head>
        <!-- tiltle is used to change the tab name  -->
            <title>Home Page</title>      
        <body>
            <h1>Hello Friends....</h1>
            
            <p>
                Menu :  
            </p>
            <!-- ordered list using type -->
             <h2>A ordered List using type</h2>
            <ol type="A">
                <li>Tea</li>
                <li>Coffee</li>

            </ol>
            <h2>ordered List using start</h2>
                <!-- ordered list using start -->
            <ol start="100">
                <li>Tea</li>
                <li>Coffee</li>
            </ol>
            <!-- unordered list using start -->
             <h2>Unordered List</h2>
             <ul>
            <li>Coffee</li>
            <li>Tea</li>
            <li>Milk</li>
            </ul>
            <!-- Description Lists using start -->
            <h2>A Description List</h2>

            <dl>
            <dt>Coffee</dt>
            <dd>- black hot drink</dd>
            <dt>Milk</dt>
            <dd>- white cold drink</dd>
            </dl>
            
        </body>
    </head>
</html>
